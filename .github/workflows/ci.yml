name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:unit
      - run: npm audit --omit=dev --audit-level=high
      - run: npm pack --dry-run

  compatibility:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      matrix:
        include:
          - astro: 5.0.0
            node: 18.17.1
          - astro: 6.4.8
            node: 22
          - astro: 7.2.2
            node: 24
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: mkdir -p .tmp/package && npm pack --ignore-scripts --pack-destination .tmp/package
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: node tests/compatibility.mjs .tmp/package/astro-wysiwyg-*.tgz ${{ matrix.astro }}

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium firefox webkit
      - run: npm run check
